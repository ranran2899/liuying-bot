[tool.poetry]
name = "liuying"
version = "0.1.4"
description = "基于NoneBot2.5.0的liuying_bot项目，集成了OneBot V11 V12适配器和QQ适配器"
authors = ["Project Maintainer <2027839379@qq.com>"]
license = "AGPL"
package-mode = false
readme = "README.md"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.11"
nonebot2 = { extras = ["fastapi"], version = ">=2.5.0,<2.6.0" }
# nonebot-adapter-mail = "*" # 邮件适配器
nonebot-adapter-onebot = "*" # OneBot V11 V12 适配器
nonebot-adapter-qq = "==1.7.1" # QQ适配器
nonebot-adapter-minecraft = "==1.8.1" # Minecraft适配器
nonebot-plugin-apscheduler = "==0.5.0"
httpx = "*"
websockets = "*"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
pymysql = ">=1.0,<2.0"  # 用于MySQL支持
nonebot-plugin-uninfo = "^0.11.0"
nonebot-plugin-waiter = "^0.8.1"
nonebot-plugin-alconna = "^0.62.0"
nonebot-plugin-session = "^0.3.2"
nonebot_plugin_localstore = "^0.7.4"
nonebot-plugin-htmlrender = "^0.6.7"
playwright = "==1.53.0"
cattrs = "^25.1.1"
ruamel-yaml = "^0.18.15"
typing_extensions = ">=4.0.0"
Pillow = ">=9.0.0"
ujson = ">=5.0.0"
qrcode = "^8.0"  # 用于生成二维码
imagehash = "^4.3.1"  # 用于图片哈希计算
thefuzz = "^0.22.1"
cookit = "^0.13.0"
jieba = "^0.42.1"
pypinyin = "^0.55.0"
markdown-it-py = "^4.0.0"
mdit-py-plugins = "^0.5.0"
pytz = "^2023.3"
numpy = "^1.26.0"
aiosqlite = "^0.22.0"
pyspellchecker = "^0.8.3"
aiocache = {extras = ["redis"], version = "^0.12.3"}
orjson = "^3.11.8" #高性能JSON解析库
redis = { version = ">=5", optional = true }
psycopg2-binary = "^2.9.11"
rich = "^13.0.0"  # 用于进度条显示
tenacity = "^9.0.0"  # 用于重试机制
itsdangerous = "^2.2.0"  # 用于安全签名和数据序列化
python-multipart = "^0.0.20"  # 用于处理表单数据
charset-normalizer = "^3.0.0"
python-jose = "^3.5.0"
psutil = "^7.1.3"
asyncmy = "^0.2.10"
asyncpg = "^0.31.0"
cos-python-sdk-v5 = "^1.9.41" # 腾讯云 COS
bce-python-sdk = "^0.9.59" # 百度云 OSS
oss2 = "^2.19.1" # 阿里云 (OSS)
esdk_obs_python = "==3.26.2" # 华为云 OBS
boto3 = "^1.35.60" # 标准 AWS SDK
aiohttp = "^3.13.3"
# ddgs = "^9.14.0"
pydantic = "^2.13.3"
py-cpuinfo = "^9.0.0"

[tool.poetry.extras]
redis = ["redis"]


[tool.poetry.group.dev.dependencies]
nonebug = "^0.4"
pytest-cov = "^5.0.0"
pytest-mock = "^3.6.1"
pytest-asyncio = "^0.25"
pytest-xdist = "^3.3.1"
respx = "^0.21.1"
ruff = "^0.8.0"
pre-commit = "^4.0.0"

[tool.nonebot]
plugins = [
    "nonebot_plugin_apscheduler",
    "nonebot_plugin_session",
    "nonebot_plugin_htmlrender",
    "nonebot_plugin_alconna",
]
plugin_dirs = ["liuying/liuying_plugins",  "liuying/plugins"]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "QQ", module_name = "nonebot.adapters.qq" },
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "W", # pycodestyle warnings
    "E", # pycodestyle errors
    "I", # isort
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "UP037", # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF006", # asyncio-dangling-task
    "ASYNC109", # async-function-with-timeout
    "TID252", # relative-imports
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["liuying", "tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
    { root = "./tests", extraPaths = [
        "./",
    ] },
    { root = "./" },
]

typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
