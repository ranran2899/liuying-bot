[project]
name = "liuying"
version = "0.1.6"
description = "基于NoneBot2.5.0的liuying_bot项目，集成了OneBot V11 V12适配器和QQ适配器"
authors = [
    { name = "ranranran", email = "2027839379@qq.com" },
]
license = { text = "AGPL" }
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "nonebot2[fastapi]>=2.5.0,<2.6.0",
    # nonebot-adapter-mail # 邮件适配器
    "nonebot-adapter-onebot", # OneBot V11 V12 适配器
    "nonebot-adapter-qq==1.7.1", # QQ适配器
    "nonebot-adapter-minecraft==1.8.2", # Minecraft适配器
    "nonebot-plugin-apscheduler==0.5.0",
    "httpx",
    "websockets",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
    "pymysql>=1.2.0,<2.0", # 用于MySQL支持
    "nonebot-plugin-uninfo==0.11.1",
    "nonebot-plugin-waiter>=0.8.1,<0.9.0",
    "nonebot-plugin-alconna==0.62.1",
    "nonebot-plugin-session>=0.3.2,<0.4.0",
    "nonebot-plugin-localstore>=0.7.4,<0.8.0",
    "nonebot-plugin-htmlrender>=0.6.7,<0.7.0",
    "playwright==1.53.0",
    "cattrs>=25.1.1,<26.0.0",
    "ruamel-yaml>=0.18.15,<0.19.0",
    "typing-extensions>=4.16.0",
    "pillow>=12.3.0",
    "ujson>=5.13.0",
    "qrcode>=8.2,<9.0.0", # 用于生成二维码
    "imagehash>=4.3.2,<5.0.0", # 用于图片哈希计算
    "thefuzz>=0.22.1,<0.23.0",
    "cookit>=0.13.3,<0.14.0",
    "jieba>=0.42.1,<0.43.0",
    "pypinyin>=0.55.0,<0.56.0",
    "markdown-it-py>=4.2.0,<5.0.0",
    "mdit-py-plugins>=0.5.0,<0.6.0",
    "pytz>=2023.3,<2024.0",
    "numpy>=1.26.0,<2.0.0",
    "aiosqlite>=0.22.1,<0.23.0",
    "pyspellchecker>=0.8.3,<0.9.0",
    "aiocache[redis]>=0.12.3,<0.13.0",
    "orjson>=3.11.9,<4.0.0", # 高性能JSON解析库
    "psycopg2-binary>=2.9.12,<3.0.0",
    "rich>=13.0.0,<14.0.0", # 用于进度条显示
    "tenacity>=9.1.4,<10.0.0", # 用于重试机制
    "itsdangerous>=2.2.0,<3.0.0", # 用于安全签名和数据序列化
    "python-multipart>=0.0.20,<0.0.21", # 用于处理表单数据
    "charset-normalizer>=3.4.9,<4.0.0",
    "python-jose>=3.5.0,<4.0.0",
    "psutil>=7.2.2,<8.0.0",
    "asyncmy>=0.2.11,<0.3.0",
    "asyncpg>=0.31.0,<0.32.0",
    "cos-python-sdk-v5>=1.9.44,<2.0.0", # 腾讯云 COS
    "bce-python-sdk>=0.9.76,<0.10.0", # 百度云 OSS
    "oss2>=2.19.1,<3.0.0", # 阿里云 (OSS)
    "esdk-obs-python==3.26.2", # 华为云 OBS
    "boto3>=1.43.63,<2.0.0", # 标准 AWS SDK
    "aiohttp>=3.14.3,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "py-cpuinfo>=9.0.0,<10.0.0",
]

[project.optional-dependencies]
redis = ["redis>=8.1.0"]

[dependency-groups]
dev = [
    "nonebug>=0.4.4,<0.5",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-xdist>=3.8.0,<4.0.0",
    "respx>=0.21.1,<0.22.0",
    "ruff>=0.8.0,<0.9.0",
    "pre-commit>=4.6.1,<5.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.nonebot]
plugins = [
    "nonebot_plugin_apscheduler",
    "nonebot_plugin_session",
    "nonebot_plugin_htmlrender",
    "nonebot_plugin_alconna",
    "nonebot_plugin_uninfo",
]
plugin_dirs = ["liuying/liuying_plugins",  "liuying/plugins"]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "QQ", module_name = "nonebot.adapters.qq" },
    { name = "Minecraft", module_name = "nonebot.adapters.minecraft" },
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "W", # pycodestyle warnings
    "E", # pycodestyle errors
    "I", # isort
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "UP037", # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF006", # asyncio-dangling-task
    "ASYNC109", # async-function-with-timeout
    "TID252", # relative-imports
]

[tool.ruff.lint.per-file-ignores]
"liuying/liuying_plugins/AI/core/persona_prompts.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["liuying", "tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
    { root = "./tests", extraPaths = [
        "./",
    ] },
    { root = "./", extraPaths = [
        "./",
    ] },
]

typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
