<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漂流瓶审核</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/bottle/static/css/admin.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-droplet-fill"></i> 漂流瓶管理</h3>
            <p>审核控制台</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-category">审核管理</div>
            <a href="/bottle/check" class="menu-item active">
                <i class="bi bi-bottle"></i>
                瓶子审核
                <span class="badge" id="sidebar-bottles">{{ pending_count }}</span>
            </a>
            <a href="/bottle/comments" class="menu-item">
                <i class="bi bi-chat-dots"></i>
                评论审核
                <span class="badge" id="sidebar-comments">{{ pending_comments }}</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1>瓶子审核</h1>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <h4>待审核瓶子</h4>
                <div class="number" id="pending-count">{{ pending_count }}</div>
            </div>
            <div class="stat-card">
                <h4>待审核评论</h4>
                <div class="number">{{ pending_comments }}</div>
            </div>
        </div>

        <div class="content-card" id="bottle-card">
            <div id="message"></div>
            <div id="bottle" style="display:none;">
                <div class="info-row">
                    <span class="label">ID:</span>
                    <span class="value" id="id"></span>
                </div>
                <div class="info-row">
                    <span class="label">内容:</span>
                    <span class="value" id="content"></span>
                </div>
                <div class="info-row">
                    <span class="label">用户ID:</span>
                    <span class="value" id="userid"></span>
                </div>
                <div class="info-row">
                    <span class="label">群组ID:</span>
                    <span class="value" id="groupid"></span>
                </div>
                <div class="info-row">
                    <span class="label">发送时间:</span>
                    <span class="value" id="timeinfo"></span>
                </div>
                <div class="bottle-images" id="images"></div>
                <div class="action-buttons">
                    <button class="btn-approve" onclick="approveBottle()">
                        <i class="bi bi-check-lg"></i> 通过
                    </button>
                    <button class="btn-refuse" onclick="refuseBottle()">
                        <i class="bi bi-x-lg"></i> 拒绝
                    </button>
                </div>
            </div>
            <div id="empty-state" class="empty-state" style="display:none;">
                <i class="bi bi-check-circle-fill"></i>
                <h3>没有待审核的瓶子</h3>
                <p>所有瓶子都已审核完毕</p>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeZoom()"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function base64ToArrayBuffer(base64) {
            return new Promise((resolve, reject) => {
                try {
                    var binaryString = window.atob(base64);
                    var len = binaryString.length;
                    var bytes = new ArrayBuffer(len);
                    for (var i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    resolve(bytes.buffer);
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function fetchBottle() {
            try {
                const response = await fetch('/bottle/bottles/random');
                if (response.status === 404) {
                    document.getElementById('bottle').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }
                const data = await response.json();
                const encryptedData = window.atob(data.Data);
                const iv = window.atob(data.a);
                const encryptedDataArray = Uint8Array.from(encryptedData, c => c.charCodeAt(0));
                const ivArray = Uint8Array.from(iv, c => c.charCodeAt(0));
                const keyData = CryptoJS.SHA256(data.a);
                const keyHex = CryptoJS.enc.Hex.stringify(keyData);
                const keyArray = Uint8Array.from(keyHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                const key = await window.crypto.subtle.importKey(
                    "raw",
                    keyArray,
                    { name: "AES-CBC" },
                    false,
                    ["decrypt"]
                );
                const decryptedData = await window.crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: ivArray },
                    key,
                    encryptedDataArray
                );
                const dec = new TextDecoder();
                const decrypted = dec.decode(decryptedData);
                const bottle = JSON.parse(decrypted);

                document.getElementById('id').innerText = bottle.ID;
                document.getElementById('content').innerText = bottle.Content;
                document.getElementById('userid').innerText = bottle.UserID;
                document.getElementById('groupid').innerText = bottle.GroupID || '无';
                document.getElementById('timeinfo').innerText = bottle.TimeInfo;

                const imagesContainer = document.getElementById('images');
                imagesContainer.innerHTML = '';
                bottle.Images.forEach(img => {
                    const image = new Image();
                    image.src = `data:image/png;base64,${img}`;
                    image.addEventListener('click', () => toggleZoom(image));
                    imagesContainer.appendChild(image);
                });

                document.getElementById('bottle').style.display = 'block';
                document.getElementById('empty-state').style.display = 'none';
            } catch (error) {
                console.error('发生错误:', error);
            }
        }

        function toggleZoom(img) {
            document.getElementById('overlay').classList.add('show');
            img.classList.add('zoomed');
            document.body.classList.add('zoomed-image');
        }

        function closeZoom() {
            document.getElementById('overlay').classList.remove('show');
            document.querySelectorAll('.zoomed').forEach(el => el.classList.remove('zoomed'));
            document.body.classList.remove('zoomed-image');
        }

        async function approveBottle() {
            try {
                const id = document.getElementById('id').innerText;
                const response = await fetch(`/bottle/bottles/approve/${id}`, { method: 'POST' });
                if (response.ok) {
                    await fetchBottle();
                    await updatePendingCount();
                } else {
                    console.error('审核通过失败:', await response.json());
                }
            } catch (error) {
                console.error('发生错误:', error);
            }
        }

        async function refuseBottle() {
            try {
                const id = document.getElementById('id').innerText;
                const response = await fetch(`/bottle/bottles/refuse/${id}`, { method: 'POST' });
                if (response.ok) {
                    await fetchBottle();
                    await updatePendingCount();
                } else {
                    console.error('审核拒绝失败:', await response.json());
                }
            } catch (error) {
                console.error('发生错误:', error);
            }
        }

        async function updatePendingCount() {
            try {
                const response = await fetch('/bottle/check');
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const pendingCountElement = doc.querySelector('#pending-count');
                if (pendingCountElement) {
                    const count = pendingCountElement.innerText;
                    document.getElementById('pending-count').innerText = count;
                    document.getElementById('sidebar-bottles').innerText = count;
                }
            } catch (error) {
                console.error('发生错误:', error);
            }
        }

        window.onload = async () => {
            await fetchBottle();
        };
    </script>
</body>
</html>
